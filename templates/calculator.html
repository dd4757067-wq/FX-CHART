{% extends "base.html" %}{% block title %}Risk Calculator — FX CHART{% endblock %}
{% block content %}<div class="card"><h1>Risk Calculator</h1><div class="formgrid"><label>Account balance<input id="bal" type="number" value="1000"></label><label>Risk %<input id="risk" type="number" value="1" step="0.1"></label><label>Entry<input id="entry" type="number" value="1.1000" step="any"></label><label>Stop Loss<input id="sl" type="number" value="1.0950" step="any"></label></div><button class="btn primary" onclick="calcRisk()">Calculate</button><div id="calcOut" class="metric"></div><p class="muted">This is a simplified educational calculation. Exact lot sizing varies by instrument, contract size and account currency.</p></div>{% endblock %}
