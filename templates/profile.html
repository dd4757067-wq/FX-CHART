{% extends 'base.html' %}
{% block title %}Profile • FX CHART{% endblock %}
{% block content %}
<section class="profile-page">
 <div class="profile-cover glass-card"><div class="avatar-wrap"><label class="avatar-click"><img src="{{ url_for('static', filename='images/dfx-logo.jpg') if not user.photo else url_for('static', filename='uploads/'+user.photo) }}" alt="Profile"><input id="avatarInput" type="file" name="photo" form="profileForm" accept="image/*"></label><span>Tap avatar to change photo</span></div><div><span class="eyebrow">TRADER PROFILE</span><h1>{{user.full_name or user.username}}</h1><p>@{{user.username}}</p></div></div>
 <form id="profileForm" class="glass-card profile-form" method="post" action="/profile/update" enctype="multipart/form-data">
  <div class="form-grid"><label>Full name<input name="full_name" value="{{user.full_name or ''}}"></label><label>Username<input name="username" value="{{user.username or ''}}"></label><label>Email<input type="email" name="email" value="{{user.email or ''}}"></label><label>Experience<input name="experience" value="{{user.experience or ''}}"></label><label>Trading style<input name="trading_style" value="{{user.trading_style or ''}}"></label><label>Favorite market<input name="favorite_market" value="{{user.favorite_market or ''}}"></label><label>Favorite pairs<input name="favorite_pairs" value="{{user.favorite_pairs or ''}}"></label><label>Strategy<input name="strategy" value="{{user.strategy or ''}}"></label></div>
  <label>Bio<textarea name="bio" rows="5">{{user.bio or ''}}</textarea></label><button class="neo-btn" type="submit">Save Profile</button>
 </form>
</section>
{% endblock %}
{% block scripts %}<script>document.getElementById('avatarInput')?.addEventListener('change',()=>document.getElementById('profileForm').requestSubmit());</script>{% endblock %}
